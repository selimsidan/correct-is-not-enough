# Training phase. The base model (id, revision, dtype) is taken from generate.yaml so training,
# prediction and the zero-shot baseline use exactly the same weights.

export:
  seed: 0
  # SFT epochs exported; each epoch has exactly one example per train question in every SFT arm.
  # The method comparison trains epoch 0 only; the winner continues with epoch 1.
  epochs: 2
  # Whole train databases held out for validation (never dev or minidev). `typical` picks databases
  # that resemble the pool (decided 2026-11-14; on pool_v1: beer_factory, car_retails, movies_4,
  # retail_complains); `random` is a seeded draw.
  validation:
    rule: typical
    fraction: 0.05
  weighted:
    # p proportional to 2^(beta * eff_score) = (gold_cost / cost)^beta over a question's correct candidates.
    # 0 = uniform over correct candidates; large = best only.
    beta: 1.0
  tagged:
    # Tag = eff_score clipped to [-clip, clip] and rounded to `decimals`.
    clip: 3.0
    decimals: 1
    # Default test-time tag: this quantile of each train question's best eff_score.
    inference_quantile: 0.9
  dpo:
    # Only questions with at least one efficiency pair (decided 2026-11-13). Per question: up to
    # efficiency_pairs pairs of a cheaper correct over a pricier correct answer, plus up to
    # correctness_pairs of a cheapest correct over an incorrect answer (keeps correctness in the signal).
    # On pool_v1: 2,210 train questions, 3,457 efficiency and 1,263 correctness pairs.
    efficiency_pairs: 4
    correctness_pairs: 1
    # An efficiency pair needs the rejected query to cost at least min_ratio times the chosen one
    # (smoothed steps, as in eff_score) and at least min_abs_steps more. Decided 2026-11-13: at 2x the
    # real-time ordering agrees with the step ordering for 95% of pairs (85.6% at 1.5x, pool_v1
    # verification), and R-VES's top reward starts at 2x faster than gold.
    min_ratio: 2.0
    min_abs_steps: 50

prompt:
  # Used for training AND for predicting with fine-tuned models (`predict --max-prompt-tokens`).
  # If this differs from generate.yaml, re-predict the zero-shot baseline with the same budget.
  max_prompt_tokens: 12000

sft:
  # Exact base weights for training and for predicting with the adapters: the Hugging Face commit
  # pool_v1 and the zero-shot baseline ran on (recorded in their generation records, 2026-11-08).
  base_revision: c03e6d358207e414f1eca0bb1891e29f1db0e242
  # LoRA on every linear layer of the bf16 base model (the same weights vLLM serves).
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  lr: 1.0e-4
  # The winner's second epoch starts from its epoch-0 adapter with a fresh optimizer and lr x this.
  continue_lr_factor: 0.5
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  # Questions per optimizer step (gradient accumulation; no padding anywhere).
  grad_accum: 16
  # Shared-schema groups: up to pack_size questions of one database share one copy of the system
  # prompt and schema in a sequence (each question sees only that prefix and itself, so its loss is
  # exactly its loss alone). With grad_accum 16 a step is two groups from two databases. Decided
  # 2026-11-14: about 6x fewer tokens than one question per sequence (A100 pilot: 41 units per epoch
  # without groups). 1 = one question per sequence.
  pack_size: 8
  gradient_checkpointing: true
  # Training stops at once on a smaller GPU: the longest shared-schema sequence peaks at about 23 GiB
  # (A100 runs, 2026-11-14), so an L4 (22 GiB usable) runs out of memory.
  min_gpu_memory_gb: 35
  attn_implementation: sdpa
  # Optimizer steps between checkpoints on Drive (resume after a Colab disconnect) and validation losses.
  save_every: 50
  eval_every: 250
  keep_checkpoints: 2
  seed: 0
  # Approximate Colab compute units per hour, only for the pilot's cost projection (check Colab's
  # resources panel for the current rate).
  units_per_hour: {A100: 11.8, L4: 4.8, T4: 1.8}

dpo:
  # DPO with an NLL term on the chosen answer ("RPO"), from the kept SFT adapter (LoRA settings,
  # gradient checkpointing, clipping and the GPU check come from `sft`). Defaults set 2026-11-15.
  # Pairwise preference strength: higher keeps the model closer to the SFT model.
  beta: 0.1
  # Weight of the chosen answer's mean token cross entropy: keeps the chosen (correct) answers likely,
  # so the preference term cannot win by making both answers unlikely.
  rpo_alpha: 1.0
  lr: 1.0e-5
  warmup_ratio: 0.1
  epochs: 1
  # Questions per optimizer step, in shared-schema groups of pack_size questions (as in SFT). A group is
  # cut into sequences of at most max_answers_per_seq answers (whole questions).
  questions_per_step: 16
  pack_size: 8
  max_answers_per_seq: 16
  save_every: 25
  eval_every: 50
  seed: 0

rl:
  # Reinforcement learning with an execution reward (GRPO-style), from a finished SFT adapter (LoRA
  # settings, gradient checkpointing, clipping and the GPU check come from `sft`). Planned 2026-11-16.
  # An iteration: `questions_per_iter` new train questions (never the validation databases), `samples`
  # answers each from the current model (vLLM, temperature 1: exactly the model's distribution), every
  # answer executed and scored, then one pass of policy-gradient updates on those answers.
  # 24 x 128 = 3,072 questions (2026-11-16, after the pilot: about 7.5 minutes per iteration on an A100).
  iterations: 24
  questions_per_iter: 128
  # all: every train question with a usable gold; focus: only those in `focus` (see rl_eff).
  questions: all
  samples: 8
  max_tokens: 512
  reward:
    # Wrong, failing, cut-off or without SQL: 0. Also 0 (and counted): a first-row pick that gold does
    # not use (`x = (SELECT ...)` with a subquery that can return several rows, LIMIT without ORDER BY)
    # and constants found nowhere in the question, evidence or gold (pool/quality.py). These matched
    # gold in the pilot only by luck and cost strong DPO accuracy on dev.
    # Correct: 1 + eff_weight * e / eff_clip with e = log2((gold_steps + smooth) / (steps + smooth))
    # clipped to [-eff_clip, eff_clip]: between 0.1 (4x costlier than gold) and 1.9 (4x cheaper), so a
    # correct answer always beats a wrong one. smooth (steps) keeps tiny queries from counting as wins.
    # 0.9 (was 0.5): in the pilot the model's own answers to a question rarely differ in cost, so cost made
    # only about 10% of the training signal at 0.5 (about 17% at 0.9).
    eff_weight: 0.9
    eff_clip: 2.0
    smooth_steps: 100
  # Execution while training (correctness as in screening, step counting capped at this x gold).
  exec_timeout_s: 10
  count_timeout_s: 60
  step_cap_factor: 20
  # Policy update: advantage = reward - mean reward of the question's answers (no division by the
  # standard deviation, so tiny cost differences are not blown up); questions whose answers all score
  # the same give no signal and are skipped. Clipped ratio loss (PPO), averaged over answer tokens.
  # No KL term: correctness is in the reward, and validation decides whether the result is kept.
  # 5e-5 (was 1e-5): at 1e-5 the pilot's updates were far below a normal policy step (approximate KL
  # 1e-4, 0.02% of tokens clipped; usual values are about 1e-3 to 1e-2 and a few percent).
  lr: 5.0e-5
  warmup_steps: 2
  questions_per_step: 16
  clip_eps: 0.2
  # A question's answers share its prompt in one sequence, cut so that no sequence has more answer tokens
  # than this (bounds the memory of the vocabulary-sized log probabilities; results are identical).
  max_answer_tokens_per_seq: 2048
  # vLLM runs alone on the GPU in its own process (the trainer runs after it, in another process).
  gpu_memory_utilization: 0.85
  # A copy of the adapter every this many iterations goes to its own run <run>_it<n> (predicted and
  # compared on validation like the final model: the number of iterations is chosen there).
  snapshot_every: 8
  # Pilot (`rl --pilot`): measures time per phase and reward movement, projects the full run's cost.
  pilot: {iterations: 2, questions_per_iter: 32}
  keep_iterations: 2
  seed: 0

rl_eff:
  # Efficiency phase (`rl --settings rl_eff`; planned 2026-11-16): overrides of `rl`. In rl_v1 accuracy
  # rose (dev EX +3.7) but cost did not move: a question teaches efficiency only when the model's correct
  # answers to it differ in cost, which was rare, so most of the signal was correctness. Here:
  # only questions where efficiency can be learned (strictly usable pool query at most 0.9 x gold's cost:
  # 1,684 questions; or correct rl_v1 answers 10% apart in cost: 450; together 1,953), 16 answers per
  # question (more chances to differ in cost), and a reward that saturates at 2x instead of 4x: a correct
  # answer scores 0.1 at 2x gold's cost, 1 at gold's cost, 1.9 at half (twice as steep as rl_v1).
  questions: focus
  focus: {pool_run: pool_v1, max_rel_cost: 0.9, history_runs: [rl_v1], min_spread: 1.1}
  iterations: 15
  samples: 16
  reward: {eff_clip: 1.0}
  snapshot_every: 5

# Cost first, then accuracy (planned 2026-11-21; notebooks 70 to 77).
# 1. The search (gen/search.py, run search_v1) gives each train question its cheapest usable correct query.
# 2. own_answers: the current model's own answers to every train question, validation databases included
#    (`rl --settings own_answers`: sampling and scoring only, no training).
# 3. pairs: chosen = the cheap target, rejected = the model's own costlier correct answer (efficiency) or
#    its own wrong answer (correctness). 4. DPO from the current model. 5. RL from the DPO model with the
#    cheapest known query as the cost yardstick (`rl --settings rl_v2`).
own_answers:
  sample_only: true
  include_holdout: true
  questions_per_iter: 1024
rl_v2:
  reward: {yardstick: cheapest_known}
  targets_run: search_v1
  iterations: 16
  snapshot_every: 8
pairs:
  # Per question, at most this many pairs; rejected answers are the most frequent distinct ones first
  # (what the model writes most often), each used once.
  efficiency_pairs: 3
  correctness_pairs: 1
  # Efficiency pair: the rejected answer costs at least min_ratio x the chosen one and min_abs_steps more.
  min_ratio: 1.1
  min_abs_steps: 50
  seed: 0
